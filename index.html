<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王嘉欣 | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        :root {
            --main: #2c423b;
            --light: #f7f7f2;
            --accent: #689788;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: var(--light);
            color: var(--main);
            line-height: 1.7;
        }
        /* 滚动淡入动画 */
        .reveal {
            opacity: 0;
            transform: translateY(32px);
            transition: all 0.7s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        header {
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(247,247,242,0.85);
            backdrop-filter: blur(8px);
            z-index:99;
            padding:1rem 10%;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .brand{
            font-size:20px;
            font-weight:600;
            text-decoration:none;
            color:var(--main);
        }
        nav a{
            margin-left:24px;
            color:var(--main);
            text-decoration:none;
            transition: color 0.3s;
        }
        nav a:hover{
            color:var(--accent);
        }
        section{
            padding: 120px 10%;
            min-height:100vh;
        }
        .hero{
            display:grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap:40px;
            align-items:center;
            padding-top:180px;
        }
        .hero h1{
            font-size:56px;
            margin-bottom:12px;
            animation: fadeUp 1s ease-out;
        }
        .hero .sub{
            font-size:20px;
            color:#555;
            margin-bottom:30px;
            animation: fadeUp 1s ease-out 0.2s backwards;
        }
        .avatar-box{
            width:320px;
            height:320px;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 12px 30px rgba(44,66,59,0.15);
            transition:transform 0.4s ease;
            animation: fadeUp 1s ease-out 0.4s backwards;
        }
        .avatar-box:hover{
            transform: translateY(-8px);
        }
        .avatar-box img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        @keyframes fadeUp{
            from{
                opacity:0;
                transform: translateY(24px);
            }
            to{
                opacity:1;
                transform: translateY(0);
            }
        }
        h2{
            font-size:32px;
            margin-bottom:24px;
            color:var(--main);
        }
        .skill-list{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap:20px;
        }
        .skill-card{
            background:#fff;
            padding:24px;
            border-radius:16px;
            box-shadow:0 4px 14px rgba(0,0,0,0.06);
            transition:0.3s;
        }
        .skill-card:hover{
            transform: translateY(-5px);
            box-shadow:0 10px 24px rgba(0,0,0,0.1);
        }
        footer{
            text-align:center;
            padding:40px;
            color:#666;
        }
        @media (max-width:768px){
            .hero{
                grid-template-columns:1fr;
            }
            .hero h1{
                font-size:40px;
            }
            header{
                flex-direction:column;
                gap:12px;
            }
            nav a{
                margin:0 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="#home" class="brand">王嘉欣</a>
        <nav>
            <a href="#home">关于</a>
            <a href="#skills">技能</a>
            <a href="#works">作品</a>
            <a href="#contact">联系</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <div>
            <h1>王嘉欣</h1>
            <p class="sub">大模型应用产业班 · 前端爱好者</p>
            <p>广东科学技术职业学院<br>喜欢摄影、视觉设计与AI应用开发，持续学习网页、Python与大模型相关技术。</p>
        </div>
        <div class="avatar-box">
            <!-- 替换成你的头像图片路径 -->
            <img src="assets/222" alt="头像">
        </div>
    </section>

    <section id="skills" class="reveal">
        <h2>技能栈</h2>
        <div class="skill-list">
            <div class="skill-card">HTML / CSS</div>
            <div class="skill-card">JavaScript</div>
            <div class="skill-card">Python</div>
            <div class="skill-card">Git & GitHub Pages</div>
            <div class="skill-card">AI大模型应用</div>
            <div class="skill-card">图像视觉设计</div>
        </div>
    </section>

    <section id="works" class="reveal">
        <h2>项目作品</h2>
        <div class="skill-list">
            <div class="skill-card">个人主页（当前网站）</div>
            <div class="skill-card">博主运营数据周报Python脚本</div>
            <div class="skill-card">Flask简易AI聊天网页</div>
        </div>
    </section>

    <section id="contact" class="reveal">
        <h2>联系方式</h2>
        <p>邮箱：xxx@xxx.com</p>
        <p>GitHub：github.com/wd456-dew</p>
    </section>

    <footer>
        © 2026 王嘉欣 | 基于GitHub Pages部署
    </footer>

    <script>
        // 滚动检测，区块淡入
        const revealItems = document.querySelectorAll('.reveal');
        function checkReveal(){
            revealItems.forEach(item=>{
                const rect = item.getBoundingClientRect();
                if(rect.top < window.innerHeight * 0.82){
                    item.classList.add('active');
                }
            })
        }
        window.addEventListener('scroll', checkReveal);
        window.addEventListener('load', checkReveal);
    </script>
</body>
</html>
